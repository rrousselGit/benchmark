# Runs the example benchmarks through the action: results are stored on
# gh-pages for pushes to main, and commented on pull requests.
name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # push results to gh-pages
  pull-requests: write # comment on same-repository pull requests

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dart:
    name: Dart benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - id: bench
        uses: ./
        with:
          # Instruction counts barely change between runners: they are what
          # gets stored and graphed. On pull requests, the benchmarks are
          # also timed against the base commit on the same machine, and the
          # comment shows both.
          suite: dart-instructions
          mode: instructions
          timings: true
          format: dart
          # Outputs stay in the checkout: on pull requests, the base commit
          # is built next to it and both run alternately.
          build: |
            cd examples/dart
            dart pub get
            mkdir -p build
            dart compile exe benchmark/main.dart -o build/dart-bench
          run: examples/dart/build/dart-bench
          threshold: 5%
          time-threshold: 20%
      - uses: ./check
        with:
          report: ${{ steps.bench.outputs.report }}

  node:
    name: Node benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: bench
        uses: ./
        with:
          suite: node
          run: node examples/node/bench.mjs > node-bench.json
          file: node-bench.json
          threshold: 25%
      - uses: ./check
        with:
          report: ${{ steps.bench.outputs.report }}
