# Runs this repository's own example benchmark through the action.
name: Benchmark

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # push results to gh-pages
  pull-requests: write # comment on same-repository pull requests

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: bench
        uses: ./
        with:
          run: node examples/bench.mjs > bench.json
          file: bench.json
      - uses: ./check
        with:
          report: ${{ steps.bench.outputs.report }}
          # The example benchmark is tiny and shared runners are noisy.
          threshold: 25%
