# Runs the example benchmarks through the action: results are stored on
# gh-pages for pushes to main, and commented on pull requests.
name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # push results to gh-pages
  pull-requests: write # comment on same-repository pull requests

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dart-instructions:
    name: Dart benchmarks (instruction counts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - id: bench
        uses: ./
        with:
          # Instruction counts barely change between runners, so these are
          # the results stored for the history graphs.
          suite: dart-instructions
          mode: instructions
          build: |
            cd examples/dart
            dart pub get
            mkdir -p build
            dart compile exe benchmark/main.dart -o build/dart-bench
          run: examples/dart/build/dart-bench
          threshold: 5%
      - uses: ./check
        with:
          report: ${{ steps.bench.outputs.report }}

  dart:
    name: Dart benchmarks (timings against base)
    # Real timings vary between runners, so they are only compared with the
    # base commit benchmarked in the same job, and never stored.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - id: bench
        uses: ./
        with:
          suite: dart
          rerun-base: always
          # Compiling ahead of time gives steadier numbers than `dart run`.
          build: |
            cd examples/dart
            dart pub get
            mkdir -p build
            dart compile exe benchmark/main.dart -o build/dart-bench
          run: 'examples/dart/build/dart-bench | tee dart-bench.txt'
          file: dart-bench.txt
          format: dart
          threshold: 20%
      - uses: ./check
        with:
          report: ${{ steps.bench.outputs.report }}

  node:
    name: Node benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: bench
        uses: ./
        with:
          suite: node
          run: node examples/node/bench.mjs > node-bench.json
          file: node-bench.json
          threshold: 25%
      - uses: ./check
        with:
          report: ${{ steps.bench.outputs.report }}
