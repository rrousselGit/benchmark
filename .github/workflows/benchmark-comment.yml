# Keeps the pull request's benchmark comment up to date when the benchmark
# run starts and completes. Required for pull requests from forks, whose own
# runs only get a read-only token, and marks suites that never reported.
name: Benchmark comment

on:
  workflow_run:
    workflows: [Benchmark]
    types: [requested, completed]

permissions:
  actions: read # download the report artifact
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./comment
