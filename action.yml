name: Benchmark tracker
description: Store benchmark results per commit, chart them over time, and comment on pull requests with the impact.
author: Remi Rousselet
branding:
  icon: trending-up
  color: blue
inputs:
  mode:
    description: '"time" reads timings from the results file. "instructions" counts the CPU instructions each benchmark iteration executes, under Valgrind, which stays stable across machines.'
    default: time
  build:
    description: Optional shell command that builds the benchmarks, run before "run" in every checkout (this commit, and the base or reference commit).
    default: ''
  file:
    description: 'mode: time. Path to the results file the benchmarks produced.'
    default: ''
  format:
    description: 'Format of the results file: "json" or "dart" (output of package:benchmark_harness).'
    default: json
  run:
    description: 'Shell command that runs the benchmarks. mode: time, optional: runs before reading the results file. mode: instructions, required: a program following the BENCHMARK_LIST / BENCHMARK_NAME protocol, such as one using package:benchmark_tracker.'
    default: ''
  samples:
    description: 'mode: time. How many times to run the benchmarks; each one keeps its median. When the base commit is benchmarked in the same job, runs alternate between the two, so build outputs must stay inside the checkout.'
    default: '5'
  iterations:
    description: 'mode: instructions. Each benchmark runs this many times and twice as many; the difference gives the cost of one iteration.'
    default: '10'
  suite:
    description: Name of this set of benchmarks. Use different names to track several suites in one repository.
    default: default
  github-token:
    description: Token used to read and push results and to comment on pull requests.
    default: ${{ github.token }}
  data-branch:
    description: Branch where results and the site are stored.
    default: gh-pages
  threshold:
    description: How much worse a benchmark must get to be reported as a regression, such as "10%".
    default: 10%
  store:
    description: Whether to commit results to the data branch. Ignored on pull requests, which are never stored.
    default: 'true'
  comment:
    description: Whether to comment on pull requests with the results.
    default: 'true'
  max-entries:
    description: Number of commits kept per branch. 0 keeps everything.
    default: '0'
  rerun-base:
    description: 'Pull requests: "always" benchmarks the base commit in the same job, "auto" uses stored results from the same kind of machine when there are any, "never" only uses those. Defaults to "always" for mode: time and "auto" for mode: instructions.'
    default: ''
  reference:
    description: 'mode: time, pushes: commit, tag or branch benchmarked alongside every push so results from different machines are comparable. Defaults to the first stored commit of the suite. "none" disables it, the default for mode: instructions.'
    default: ''
  site-url:
    description: URL of the results site, linked from comments. Defaults to the GitHub Pages URL when data-branch is gh-pages.
    default: ''
outputs:
  report:
    description: Path to the JSON report, used by rrousselgit/benchmark/check.
  markdown:
    description: The report rendered as markdown.
  regressions:
    description: Number of benchmarks that regressed beyond the threshold.
runs:
  using: node24
  main: dist/index.mjs
